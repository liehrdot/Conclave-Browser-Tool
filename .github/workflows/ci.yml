name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Unit tests
        run: npm test
      # the extension in a real Chromium against stand-in Cardmarket pages; cardmarket.com is never contacted
      - name: Browser run
        run: |
          npx --yes playwright@1.63.0 install --with-deps chromium
          npm install --no-save --ignore-scripts playwright@1.63.0
          node scripts/e2e.cjs dist/screens light
          node scripts/e2e.cjs dist/screens dark
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screens
          path: dist/screens
      # the extension folder as it is loaded into Chrome ("Load unpacked")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conclave-cardmarket-extension
          path: extension
